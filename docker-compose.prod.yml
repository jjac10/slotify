# Producción. Slotify se enchufa al Traefik ya existente del VPS: red externa
# 'traefik_net', entrypoint 'websecure' y resolver de Let's Encrypt 'letsencrypt'.
# Traefik enruta DOMAIN → frontend (nginx) → backend → postgres. Postgres NO se expone.
# Secretos → /opt/slotify/.env (ver docs/DEPLOY.md).
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [internal]

  backend:
    image: ghcr.io/jjac10/slotify-backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};"
      Jwt__Key: ${JWT_KEY}
      Crypto__EncryptionKey: ${CRYPTO_ENCRYPTION_KEY}
      Crypto__BlindIndexKey: ${CRYPTO_BLIND_INDEX_KEY}
      Cors__AllowedOrigins__0: "https://${DOMAIN}"
      # Emails reales por SMTP (IONOS, STARTTLS). Si faltan las credenciales,
      # el backend mantiene el envío simulado por log.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      # WhatsApp real vía Twilio. Si faltan, los avisos de WhatsApp se simulan por log.
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_WHATSAPP_FROM: ${TWILIO_WHATSAPP_FROM:-}
      # Enlaces de los emails (restablecer/verificar) y buzón del formulario de contacto.
      Frontend__BaseUrl: "https://${DOMAIN}"
      Support__RecipientEmail: ${SUPPORT_RECIPIENT_EMAIL:-slotify@jjalarcon.es}
    depends_on:
      postgres:
        condition: service_healthy
    networks: [internal]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    # Las migraciones de EF Core corren solas al arrancar (Program.cs → db.Database.Migrate()).

  # Backup diario de la BD: pg_dump al arrancar y cada 24 h, en formato custom
  # (pg_restore), sobre /opt/slotify/backups. Retención configurable por .env.
  backup:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: ${POSTGRES_DB}
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
    volumes:
      - ./backups:/backups
    entrypoint:
      - sh
      - -c
      - |
        while true; do
          ts=$$(date +%F_%H%M)
          if pg_dump -Fc -f "/backups/slotify_$${ts}.dump"; then
            echo "backup ok: slotify_$${ts}.dump"
            find /backups -name 'slotify_*.dump' -mtime "+$${BACKUP_RETENTION_DAYS}" -delete
          else
            echo "backup FAILED ($${ts})" >&2
          fi
          sleep 86400
        done
    depends_on:
      postgres:
        condition: service_healthy
    networks: [internal]

  frontend:
    image: ghcr.io/jjac10/slotify-frontend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    networks: [internal, traefik_net]   # 'internal' para hablar con el backend; 'traefik_net' para que Traefik lo alcance
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik_net"
      - "traefik.http.routers.slotify.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.slotify.entrypoints=websecure"
      - "traefik.http.routers.slotify.tls=true"
      - "traefik.http.routers.slotify.tls.certresolver=letsencrypt"
      - "traefik.http.services.slotify.loadbalancer.server.port=80"

volumes:
  postgres_data:

networks:
  internal:
    driver: bridge
  traefik_net:
    external: true
